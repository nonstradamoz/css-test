version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be provided in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-crs_db}
    # Security: Database port is strictly isolated to internal container network (not published to host)
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crs_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crs-redis
    restart: unless-stopped
    command: "redis-server --requirepass ${REDIS_PASSWORD:?Error: REDIS_PASSWORD must be provided in .env}"
    # Security: Redis port is strictly isolated to internal container network (not published to host)
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Error: REDIS_PASSWORD required}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - "DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be provided}@postgres:5432/${POSTGRES_DB:-crs_db}"
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - "JWT_SECRET_KEY=${JWT_SECRET_KEY:?Error: JWT_SECRET_KEY must be provided in .env}"
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-crs-receipts}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN}
      - MOCK_REFUND_OUTCOME=${MOCK_REFUND_OUTCOME:-SUCCESS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crs-worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    restart: unless-stopped
    environment:
      - "DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be provided}@postgres:5432/${POSTGRES_DB:-crs_db}"
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MOCK_REFUND_OUTCOME=${MOCK_REFUND_OUTCOME:-SUCCESS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
